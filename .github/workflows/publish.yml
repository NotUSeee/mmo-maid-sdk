name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and publish yourbot-sdk (+ mmo-maid-sdk alias)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publisher (OIDC)
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # ── Primary package: yourbot-sdk ────────────────────────────────────────
      # Ships BOTH the real `yourbot_sdk` package and the `mmo_maid_sdk` import
      # compat shim (see pyproject [tool.setuptools.packages.find]).
      - name: Build yourbot-sdk
        run: python -m build --outdir dist .

      - name: Verify yourbot-sdk
        run: |
          python -m twine check dist/*
          ls -la dist/

      - name: Publish yourbot-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Idempotent re-runs: skip files already on PyPI instead of failing
          # with 400 (e.g. when only the alias below needs a re-publish).
          skip-existing: true

      # ── Alias meta-package: mmo-maid-sdk ────────────────────────────────────
      # No code — just depends on yourbot-sdk of the same version so legacy
      # `pip install mmo-maid-sdk` keeps resolving. Published to the existing
      # mmo-maid-sdk PyPI project (which must trust this repo/workflow/env).
      - name: Build mmo-maid-sdk alias
        run: python -m build --outdir dist-meta meta

      - name: Verify mmo-maid-sdk alias
        run: |
          python -m twine check dist-meta/*
          ls -la dist-meta/

      - name: Publish mmo-maid-sdk alias to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-meta
          skip-existing: true
